<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วางแผนการเงิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --base: #1e1e2e; --mantle: #181825; --crust: #11111b;
    --surface0: #313244; --surface1: #45475a; --surface2: #585b70;
    --overlay0: #6c7086; --overlay1: #7f849c;
    --subtext0: #a6adc8; --subtext1: #bac2de; --text: #cdd6f4;
    --blue: #89b4fa; --teal: #94e2d5; --green: #a6e3a1;
    --yellow: #f9e2af; --peach: #fab387; --maroon: #eba0ac;
    --red: #f38ba8; --mauve: #cba6f7;
    --r: 16px; --r-sm: 10px; --r-lg: 20px;
  }
  html { font-size: 16px; }
  body { background: var(--crust); color: var(--text); font-family: 'IBM Plex Sans Thai', sans-serif; min-height: 100vh; padding-bottom: 80px; }
  .app { max-width: 700px; margin: 0 auto; padding: 0 16px; }

  /* ── PIN Screen ── */
  #pinScreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .pin-card {
    background: var(--mantle); border: 1px solid var(--surface1); border-radius: var(--r-lg);
    padding: 36px 28px; width: 100%; max-width: 320px; text-align: center;
  }
  .pin-icon { font-size: 2.5rem; margin-bottom: 12px; }
  .pin-title { font-size: 1.1rem; font-weight: 600; color: var(--mauve); margin-bottom: 6px; }
  .pin-subtitle { font-size: .82rem; color: var(--overlay1); margin-bottom: 24px; }
  .pin-dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; }
  .pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--surface2); background: transparent; transition: all .15s;
  }
  .pin-dot.filled { background: var(--mauve); border-color: var(--mauve); }
  .pin-numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pin-key {
    background: var(--surface0); border: 1px solid var(--surface1); color: var(--text);
    border-radius: var(--r); padding: 16px; font-size: 1.2rem; font-weight: 500;
    cursor: pointer; font-family: 'JetBrains Mono', monospace;
    transition: background .1s, transform .1s; user-select: none;
  }
  .pin-key:active { background: var(--surface1); transform: scale(.95); }
  .pin-key.del { font-size: 1rem; color: var(--overlay1); }
  .pin-key.empty { background: transparent; border-color: transparent; cursor: default; }
  .pin-error { color: var(--red); font-size: .82rem; margin-top: 14px; min-height: 20px; }
  .pin-loading { color: var(--overlay1); font-size: .82rem; margin-top: 14px; }

  /* ── Main App ── */
  #mainApp { display: none; }
  .app-header { background: var(--mantle); border-bottom: 1px solid var(--surface0); padding: 18px 20px 14px; margin: 0 -16px 20px; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .header-title { font-size: 1.1rem; font-weight: 600; color: var(--mauve); letter-spacing: .02em; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .sync-status { font-size: .72rem; display: flex; align-items: center; gap: 5px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--overlay0); }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.busy { background: var(--yellow); animation: pulse .8s infinite; }
  .sync-dot.err { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .logout-btn { background: transparent; border: none; color: var(--overlay1); cursor: pointer; font-size: .8rem; padding: 4px 8px; border-radius: var(--r-sm); transition: color .15s; }
  .logout-btn:hover { color: var(--red); }
  .month-nav { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .month-label { font-family: 'JetBrains Mono', monospace; font-size: 1rem; color: var(--text); font-weight: 500; flex: 1; text-align: center; }
  .nav-btn { background: var(--surface0); border: none; color: var(--subtext1); border-radius: var(--r-sm); width: 34px; height: 34px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .nav-btn:hover { background: var(--surface1); color: var(--text); }

  .card { background: var(--mantle); border-radius: var(--r-lg); border: 1px solid var(--surface0); padding: 18px; margin-bottom: 16px; }
  .card-title { font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--overlay1); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card-title .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .card-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-title-row .card-title { margin-bottom: 0; }

  .summary-card { background: linear-gradient(135deg, var(--mantle) 0%, #1a1a2e 100%); border-color: var(--surface1); }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .summary-item { background: var(--surface0); border-radius: var(--r); padding: 12px 14px; }
  .summary-item-label { font-size: .72rem; color: var(--overlay1); margin-bottom: 4px; }
  .summary-item-value { font-family: 'JetBrains Mono', monospace; font-size: .95rem; font-weight: 600; }
  .summary-item-sub { font-family: 'JetBrains Mono', monospace; font-size: .75rem; color: var(--subtext0); margin-top: 2px; }
  .balance-block { background: var(--surface0); border-radius: var(--r-lg); padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .balance-label { font-size: .8rem; color: var(--subtext0); }
  .balance-value { font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; font-weight: 700; }
  .badge { padding: 4px 10px; border-radius: 20px; font-size: .72rem; font-weight: 600; white-space: nowrap; }
  .badge-ok { background: color-mix(in srgb, var(--green) 20%, transparent); color: var(--green); }
  .badge-warn { background: color-mix(in srgb, var(--peach) 20%, transparent); color: var(--peach); }

  .settings-toggle { background: var(--surface0); border: none; color: var(--subtext1); border-radius: var(--r-sm); padding: 8px 12px; font-size: .8rem; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Sans Thai', sans-serif; transition: background .15s; margin-bottom: 12px; }
  .settings-toggle:hover { background: var(--surface1); color: var(--text); }
  .settings-body { display: none; }
  .settings-body.open { display: block; }
  .settings-row { display: flex; gap: 10px; align-items: flex-end; }
  .field-group { flex: 1; }
  .field-label { font-size: .75rem; color: var(--subtext0); margin-bottom: 5px; }

  input[type=text], input[type=number] { background: var(--surface0); border: 1px solid var(--surface1); color: var(--text); border-radius: var(--r-sm); padding: 9px 12px; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: .9rem; width: 100%; outline: none; transition: border-color .15s; }
  input[type=text]:focus, input[type=number]:focus { border-color: var(--mauve); }
  input[type=number] { font-family: 'JetBrains Mono', monospace; }
  input::placeholder { color: var(--overlay0); }

  .mode-tabs { display: flex; background: var(--surface0); border-radius: var(--r-sm); padding: 3px; gap: 3px; margin-bottom: 12px; }
  .mode-tab { flex: 1; padding: 7px; border: none; border-radius: 7px; cursor: pointer; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: .8rem; background: transparent; color: var(--subtext0); transition: all .15s; }
  .mode-tab.active { background: var(--surface1); color: var(--text); font-weight: 500; }

  .add-form { display: flex; flex-direction: column; gap: 8px; }
  .add-row { display: flex; gap: 8px; }
  .preview-box { background: var(--surface0); border-radius: var(--r-sm); padding: 10px 12px; font-family: 'JetBrains Mono', monospace; font-size: .82rem; color: var(--teal); display: none; }
  .preview-box.show { display: block; }

  .btn { padding: 9px 16px; border-radius: var(--r-sm); border: none; cursor: pointer; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: .85rem; font-weight: 500; transition: opacity .15s; white-space: nowrap; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--mauve); color: var(--crust); }
  .btn-green { background: var(--green); color: var(--crust); }
  .btn-sm { padding: 5px 10px; font-size: .78rem; }
  .btn-ghost { background: var(--surface0); color: var(--subtext1); border: 1px solid var(--surface1); }
  .btn-ghost:hover { background: var(--surface1); color: var(--text); opacity: 1; }
  .btn-copy { background: color-mix(in srgb, var(--blue) 20%, transparent); color: var(--blue); border: 1px solid color-mix(in srgb, var(--blue) 30%, transparent); font-size: .78rem; padding: 7px 12px; }

  .item-list { display: flex; flex-direction: column; gap: 6px; }
  .item { background: var(--surface0); border-radius: var(--r); padding: 11px 12px; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; transition: border-color .15s; }
  .item:hover { border-color: var(--surface1); }
  .item.done { opacity: .5; }
  .item.done .item-name { text-decoration: line-through; color: var(--overlay0); }
  .item-check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--surface2); background: transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .item-check.checked-green { border-color: var(--green); background: color-mix(in srgb, var(--green) 25%, transparent); }
  .item-check.checked-mauve { border-color: var(--mauve); background: color-mix(in srgb, var(--mauve) 25%, transparent); }
  .item-check svg { display: none; }
  .item-check.checked-green svg, .item-check.checked-mauve svg { display: block; }
  .item-name { flex: 1; font-size: .9rem; min-width: 0; }
  .item-amount { font-family: 'JetBrains Mono', monospace; font-size: .88rem; font-weight: 500; flex-shrink: 0; }
  .item-due { font-size: .73rem; color: var(--overlay1); flex-shrink: 0; }
  .item-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .item-btn { background: transparent; border: none; color: var(--overlay0); cursor: pointer; padding: 3px 5px; border-radius: 4px; font-size: .85rem; transition: color .15s; line-height: 1; }
  .item-btn:hover { color: var(--text); }
  .item-btn.delete:hover { color: var(--red); }
  .item-btn.edit:hover { color: var(--blue); }

  .divider { border: none; border-top: 1px solid var(--surface0); margin: 12px 0; }
  .empty-state { text-align: center; color: var(--overlay0); font-size: .85rem; padding: 24px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--mantle); border: 1px solid var(--surface1); border-radius: var(--r-lg); padding: 22px; width: 100%; max-width: 360px; }
  .modal-title { font-size: .95rem; font-weight: 600; color: var(--text); margin-bottom: 16px; }
  .modal-body { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; }
  .month-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: 8px; }
  .month-opt { background: var(--surface0); border: 1px solid var(--surface1); color: var(--subtext1); border-radius: var(--r-sm); padding: 8px 4px; cursor: pointer; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: .8rem; text-align: center; transition: all .15s; }
  .month-opt:hover { background: var(--surface1); color: var(--text); }
  .month-opt.selected { background: color-mix(in srgb, var(--blue) 25%, transparent); border-color: var(--blue); color: var(--blue); }
  .year-row { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; }
  .year-val { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--text); min-width: 60px; text-align: center; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface1); color: var(--text); padding: 10px 18px; border-radius: 20px; font-size: .82rem; opacity: 0; transition: all .3s; z-index: 300; white-space: nowrap; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .summary-grid { grid-template-columns: 1fr; }
    .add-row { flex-direction: column; }
    .balance-value { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<!-- PIN Screen -->
<div id="pinScreen">
  <div class="pin-card">
    <div class="pin-icon">🔐</div>
    <div class="pin-title">วางแผนการเงิน</div>
    <div class="pin-subtitle">ใส่ PIN เพื่อเข้าใช้งาน</div>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>
    <div class="pin-numpad" id="pinNumpad"></div>
    <div class="pin-error" id="pinError"></div>
    <div class="pin-loading" id="pinLoading"></div>
  </div>
</div>

<!-- Main App -->
<div id="mainApp">
  <div class="app">
    <div class="app-header">
      <div class="header-top">
        <div class="header-title">💰 วางแผนการเงิน</div>
        <div class="header-right">
          <div class="sync-status">
            <div class="sync-dot" id="syncDot"></div>
            <span id="syncLabel" style="color:var(--overlay1)">—</span>
          </div>
          <button class="logout-btn" id="logoutBtn" title="ออกจากระบบ">🔒 ล็อค</button>
        </div>
      </div>
      <div class="month-nav">
        <button class="nav-btn" id="prevMonthBtn">‹</button>
        <div class="month-label" id="monthLabel">—</div>
        <button class="nav-btn" id="nextMonthBtn">›</button>
      </div>
    </div>

    <div class="card summary-card">
      <div class="card-title"><span class="dot" style="background:var(--mauve)"></span>สรุปภาพรวม</div>
      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-item-label">รายได้คาดการณ์</div>
          <div class="summary-item-value" style="color:var(--green)" id="sumIncome">฿0</div>
          <div class="summary-item-sub" id="sumIncomeReceived">ได้รับแล้ว ฿0</div>
        </div>
        <div class="summary-item">
          <div class="summary-item-label">รายจ่ายทั้งหมด</div>
          <div class="summary-item-value" style="color:var(--maroon)" id="sumExpense">฿0</div>
          <div class="summary-item-sub" id="sumExpensePaid">จ่ายแล้ว ฿0</div>
        </div>
      </div>
      <div class="balance-block">
        <div>
          <div class="balance-label">ยอดคงเหลือคาดการณ์</div>
          <div class="balance-value" id="balanceValue">฿0</div>
        </div>
        <span class="badge" id="balanceBadge">—</span>
      </div>
      <div id="copyBanner" style="display:none;margin-top:12px;">
        <button class="btn btn-copy" id="copyFromPrevBtn">📋 คัดลอกรายการจากเดือนก่อนหน้า</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title-row">
        <div class="card-title"><span class="dot" style="background:var(--green)"></span>รายได้เดือนนี้</div>
        <button class="btn btn-copy btn-sm" id="copyIncomeBtn">📋 คัดลอกรายได้</button>
      </div>
      <button class="settings-toggle" id="settingsToggle">⚙ ค่าแรงต่อวัน & ภาษี <span id="settingsChevron">▾</span></button>
      <div class="settings-body" id="settingsBody">
        <div class="settings-row">
          <div class="field-group">
            <div class="field-label">ค่าแรงต่อวัน (บาท)</div>
            <input type="number" id="dailyWage" placeholder="เช่น 800" min="0">
          </div>
          <div class="field-group">
            <div class="field-label">ภาษีหัก ณ ที่จ่าย (%)</div>
            <input type="number" id="taxRate" placeholder="เช่น 3" min="0" max="100" step="0.1">
          </div>
          <button class="btn btn-ghost btn-sm" id="saveProfileBtn" style="margin-bottom:1px">บันทึก</button>
        </div>
        <div style="margin-top:8px;font-size:.75rem;color:var(--overlay1)" id="profileStatus"></div>
        <hr class="divider">
      </div>
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="manual">กรอกเอง</button>
        <button class="mode-tab" data-mode="calc">คำนวณจากวันทำงาน</button>
      </div>
      <div id="modeManual" class="add-form">
        <div class="add-row">
          <input type="text" id="incomeNameManual" placeholder="ชื่อรายการรายได้" style="flex:2">
          <input type="number" id="incomeAmountManual" placeholder="จำนวน (บาท)" style="flex:1">
        </div>
        <button class="btn btn-green btn-sm" id="addIncomeManualBtn">+ เพิ่มรายได้</button>
      </div>
      <div id="modeCalc" class="add-form" style="display:none">
        <div class="add-row">
          <input type="text" id="incomeNameCalc" placeholder="ชื่อรายการ" style="flex:2">
          <input type="number" id="workDays" placeholder="จำนวนวัน" style="flex:1" min="0">
        </div>
        <div class="preview-box" id="calcPreview"></div>
        <button class="btn btn-green btn-sm" id="addIncomeCalcBtn">+ เพิ่มรายได้</button>
      </div>
      <hr class="divider">
      <div class="item-list" id="incomeList"></div>
    </div>

    <div class="card">
      <div class="card-title-row">
        <div class="card-title"><span class="dot" style="background:var(--maroon)"></span>รายจ่ายเดือนนี้</div>
        <button class="btn btn-copy btn-sm" id="copyExpenseBtn">📋 คัดลอกรายจ่าย</button>
      </div>
      <div class="add-form">
        <div class="add-row">
          <input type="text" id="expenseName" placeholder="ชื่อรายการ" style="flex:2">
          <input type="number" id="expenseAmount" placeholder="จำนวน (บาท)" style="flex:1">
        </div>
        <div class="add-row" style="align-items:center">
          <div class="field-group">
            <div class="field-label">วันที่กำหนดจ่าย (ไม่บังคับ)</div>
            <input type="number" id="expenseDueDay" placeholder="วันที่ 1-31" min="1" max="31">
          </div>
          <button class="btn btn-primary btn-sm" id="addExpenseBtn" style="margin-top:16px">+ เพิ่มรายจ่าย</button>
        </div>
      </div>
      <hr class="divider">
      <div class="item-list" id="expenseList"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="pasteModal">
  <div class="modal">
    <div class="modal-title" id="pasteModalTitle">วางรายการไปยังเดือน</div>
    <div class="modal-body">
      <div style="font-size:.8rem;color:var(--subtext0)" id="pasteModalDesc"></div>
      <div class="year-row">
        <button class="nav-btn" id="pasteYearPrev">‹</button>
        <div class="year-val" id="pasteYearLabel">—</div>
        <button class="nav-btn" id="pasteYearNext">›</button>
      </div>
      <div class="month-grid" id="pasteMonthGrid"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" id="pasteModalCancel">ยกเลิก</button>
      <button class="btn btn-primary btn-sm" id="pasteModalConfirm">วางรายการ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbztB8Vjp6wEL-KnEtC7o93lVVJj8GqHqa9UhBd-e-e0sPv7kn-K4C17jNV3hGLBmOjAnw/exec';
const SESSION_KEY = 'mp_session';

const MONTHS_TH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                   'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let plans = {}, profile = { dailyWage: 0, taxRate: 0 };
let incomeMode = 'manual', clipboard = null;
let pasteTargetYear = currentYear, pasteTargetMonth = currentMonth;
let saveTimer = null;

function monthKey(y, m) { return MONTHS_TH[m]; }
function currentKey() { return monthKey(currentYear, currentMonth); }
function prevKey() { let m=currentMonth-1,y=currentYear; if(m<0){m=11;y--;} return monthKey(y,m); }
function getMonthData(k) { if(!plans[k])plans[k]={incomes:[],expenses:[]}; return plans[k]; }
function fmt(n) { return '฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Toast ──
function showToast(msg,dur=2000){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur);}

// ── Sync ──
function setSyncStatus(state,label){document.getElementById('syncDot').className='sync-dot '+state;document.getElementById('syncLabel').textContent=label;}

// ── API ──
async function writeSheet(sheetName, rows) {
  const res = await fetch(WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ sheet: sheetName, rows })
  });
  const data = await res.json();
  if (!data.ok) throw new Error('write failed');
}
async function readSheet(sheetName) {
  try {
    const res = await fetch(`${WEBAPP_URL}?sheet=${encodeURIComponent(sheetName)}`);
    const data = await res.json();
    return data.values || [];
  } catch { return null; }
}

// ── PIN ──
let pinInput = '';
const PIN_LENGTH = 6;

function buildNumpad() {
  const pad = document.getElementById('pinNumpad');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  pad.innerHTML = keys.map(k => {
    if (k === '') return `<button class="pin-key empty" disabled></button>`;
    if (k === '⌫') return `<button class="pin-key del" data-key="del">⌫</button>`;
    return `<button class="pin-key" data-key="${k}">${k}</button>`;
  }).join('');
  pad.querySelectorAll('.pin-key[data-key]').forEach(btn => {
    btn.addEventListener('click', () => handlePinKey(btn.dataset.key));
  });
}

function updatePinDots() {
  document.querySelectorAll('.pin-dot').forEach((d,i) => {
    d.classList.toggle('filled', i < pinInput.length);
  });
}

async function handlePinKey(key) {
  if (key === 'del') {
    pinInput = pinInput.slice(0, -1);
    updatePinDots();
    document.getElementById('pinError').textContent = '';
    return;
  }
  if (pinInput.length >= PIN_LENGTH) return;
  pinInput += key;
  updatePinDots();
  if (pinInput.length === PIN_LENGTH) {
    await verifyPin(pinInput);
  }
}

async function verifyPin(pin) {
  const loading = document.getElementById('pinLoading');
  const errEl = document.getElementById('pinError');
  loading.textContent = 'กำลังตรวจสอบ...';
  errEl.textContent = '';
  try {
    const res = await fetch(`${WEBAPP_URL}?action=checkpin&pin=${encodeURIComponent(pin)}`);
    const data = await res.json();
    loading.textContent = '';
    if (data.ok) {
      sessionStorage.setItem(SESSION_KEY, '1');
      showMainApp();
    } else {
      pinInput = '';
      updatePinDots();
      errEl.textContent = '❌ PIN ไม่ถูกต้อง';
      setTimeout(() => { errEl.textContent = ''; }, 2000);
    }
  } catch {
    loading.textContent = '';
    pinInput = '';
    updatePinDots();
    errEl.textContent = '⚠️ เชื่อมต่อไม่ได้ ลองใหม่';
  }
}

function showMainApp() {
  document.getElementById('pinScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  initApp();
}

function lockApp() {
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('pinScreen').style.display = 'flex';
  pinInput = '';
  updatePinDots();
  document.getElementById('pinError').textContent = '';
}

document.getElementById('logoutBtn').onclick = lockApp;

// ── Save/Load ──
async function saveMonthToSheets(key) {
  setSyncStatus('busy','กำลังบันทึก...');
  try {
    const d = getMonthData(key);
    const rows = [['type','id','name','amount','done','dueDay']];
    for (const x of d.incomes) rows.push(['income',x.id,x.name,x.amount,x.done?'1':'0','']);
    for (const x of d.expenses) rows.push(['expense',x.id,x.name,x.amount,x.done?'1':'0',x.dueDay||'']);
    await writeSheet(key, rows);
    setSyncStatus('ok','บันทึกแล้ว');
  } catch {
    setSyncStatus('err','บันทึกไม่สำเร็จ');
    showToast('❌ บันทึกไม่สำเร็จ');
  }
}
async function saveProfileToSheets() {
  try { await writeSheet('ตั้งค่า',[['dailyWage','taxRate','pin'],[(profile.dailyWage||0),(profile.taxRate||0),'']]);} catch{}
}
async function loadMonthFromSheets(key) {
  const rows = await readSheet(key);
  if (!rows||rows.length<2){plans[key]={incomes:[],expenses:[]};return;}
  const incomes=[],expenses=[];
  for(let i=1;i<rows.length;i++){
    const [type,id,name,amount,done,dueDay]=rows[i];
    if(!type)continue;
    const item={id:id||uid(),name:name||'',amount:+amount||0,done:done==='1'};
    if(type==='income')incomes.push(item);
    else if(type==='expense')expenses.push({...item,dueDay:dueDay?+dueDay:null});
  }
  plans[key]={incomes,expenses};
}
async function loadProfileFromSheets() {
  const rows = await readSheet('ตั้งค่า');
  if(rows&&rows.length>=2){profile.dailyWage=+rows[1][0]||0;profile.taxRate=+rows[1][1]||0;}
}
function scheduleSave(key){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveMonthToSheets(key),800);}

// ── Summary ──
function updateSummary(){
  const d=getMonthData(currentKey());
  const ti=d.incomes.reduce((s,x)=>s+(+x.amount||0),0);
  const ri=d.incomes.filter(x=>x.done).reduce((s,x)=>s+(+x.amount||0),0);
  const te=d.expenses.reduce((s,x)=>s+(+x.amount||0),0);
  const pe=d.expenses.filter(x=>x.done).reduce((s,x)=>s+(+x.amount||0),0);
  const bal=ti-te;
  document.getElementById('sumIncome').textContent=fmt(ti);
  document.getElementById('sumIncomeReceived').textContent='ได้รับแล้ว '+fmt(ri);
  document.getElementById('sumExpense').textContent=fmt(te);
  document.getElementById('sumExpensePaid').textContent='จ่ายแล้ว '+fmt(pe);
  const bv=document.getElementById('balanceValue'),bb=document.getElementById('balanceBadge');
  bv.textContent=fmt(bal);
  if(te-pe<=0&&te>0){bv.style.color='var(--green)';bb.className='badge badge-ok';bb.textContent='✓ จ่ายครบแล้ว';}
  else if(te-pe>0){bv.style.color=bal>=0?'var(--yellow)':'var(--red)';bb.className='badge badge-warn';bb.textContent=`ค้างจ่าย ${fmt(te-pe)}`;}
  else{bv.style.color='var(--subtext1)';bb.className='badge';bb.textContent='—';}
  const pk=prevKey(),pd=plans[pk];
  const isEmpty=d.incomes.length===0&&d.expenses.length===0;
  const hasPrev=pd&&(pd.incomes.length>0||pd.expenses.length>0);
  document.getElementById('copyBanner').style.display=(isEmpty&&hasPrev)?'block':'none';
}

// ── Render ──
const chk=c=>`<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><polyline points="1,4 4,7 9,1" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function renderIncomes(){
  const d=getMonthData(currentKey()),list=document.getElementById('incomeList');
  if(!d.incomes.length){list.innerHTML='<div class="empty-state">ยังไม่มีรายการรายได้</div>';return;}
  list.innerHTML=d.incomes.map((x,i)=>`<div class="item ${x.done?'done':''}">
    <button class="item-check ${x.done?'checked-green':''}" data-action="check" data-type="income" data-i="${i}">${chk('var(--green)')}</button>
    <span class="item-name">${escHtml(x.name)}</span>
    <span class="item-amount" style="color:var(--green)">${fmt(x.amount)}</span>
    <div class="item-actions">
      <button class="item-btn edit" data-action="edit" data-type="income" data-i="${i}">✎</button>
      <button class="item-btn delete" data-action="delete" data-type="income" data-i="${i}">✕</button>
    </div></div>`).join('');
}
function renderExpenses(){
  const d=getMonthData(currentKey());
  const sorted=[...d.expenses].map((x,i)=>({...x,_i:i})).sort((a,b)=>{
    if(!a.dueDay&&!b.dueDay)return 0;if(!a.dueDay)return 1;if(!b.dueDay)return -1;return(+a.dueDay)-(+b.dueDay);
  });
  const list=document.getElementById('expenseList');
  if(!sorted.length){list.innerHTML='<div class="empty-state">ยังไม่มีรายการรายจ่าย</div>';return;}
  list.innerHTML=sorted.map(x=>`<div class="item ${x.done?'done':''}">
    <button class="item-check ${x.done?'checked-mauve':''}" data-action="check" data-type="expense" data-i="${x._i}">${chk('var(--mauve)')}</button>
    ${x.dueDay?`<span class="item-due">วัน ${x.dueDay}</span>`:''}
    <span class="item-name">${escHtml(x.name)}</span>
    <span class="item-amount" style="color:var(--maroon)">${fmt(x.amount)}</span>
    <div class="item-actions">
      <button class="item-btn edit" data-action="edit" data-type="expense" data-i="${x._i}">✎</button>
      <button class="item-btn delete" data-action="delete" data-type="expense" data-i="${x._i}">✕</button>
    </div></div>`).join('');
}
function renderAll(){
  document.getElementById('monthLabel').textContent=`${MONTHS_TH[currentMonth]} ${currentYear+543}`;
  updateSummary();renderIncomes();renderExpenses();updateProfileUI();
}
function updateProfileUI(){
  document.getElementById('dailyWage').value=profile.dailyWage||'';
  document.getElementById('taxRate').value=profile.taxRate||'';
  if(profile.dailyWage)document.getElementById('profileStatus').textContent=`ค่าแรงต่อวัน: ${fmt(profile.dailyWage)} | ภาษี: ${profile.taxRate||0}%`;
}

// ── Inline edit ──
function openEdit(type,idx){
  const d=getMonthData(currentKey()),arr=type==='income'?d.incomes:d.expenses,x=arr[idx];
  const listEl=document.getElementById(type==='income'?'incomeList':'expenseList');
  let targetEl=null;
  listEl.querySelectorAll('.item').forEach(el=>{if(el.querySelector(`[data-action="edit"][data-i="${idx}"]`))targetEl=el;});
  if(!targetEl)return;
  const nameSpan=targetEl.querySelector('.item-name'),amountSpan=targetEl.querySelector('.item-amount');
  const actions=targetEl.querySelector('.item-actions'),dueSpan=targetEl.querySelector('.item-due');
  const ni=Object.assign(document.createElement('input'),{type:'text',value:x.name,style:'flex:2'});
  const ai=Object.assign(document.createElement('input'),{type:'number',value:x.amount,style:'flex:1;min-width:80px'});
  let di=null;
  if(type==='expense'){di=Object.assign(document.createElement('input'),{type:'number',value:x.dueDay||'',placeholder:'วัน',style:'width:52px;flex-shrink:0'});if(dueSpan)dueSpan.replaceWith(di);else targetEl.insertBefore(di,nameSpan);}
  nameSpan.replaceWith(ni);amountSpan.replaceWith(ai);ni.focus();ni.select();
  const sb=Object.assign(document.createElement('button'),{className:'item-btn',textContent:'✓',style:'color:var(--green)'});
  const cb=Object.assign(document.createElement('button'),{className:'item-btn',textContent:'✕',style:'color:var(--overlay0)'});
  actions.innerHTML='';actions.appendChild(sb);actions.appendChild(cb);
  async function doSave(){const n=ni.value.trim(),a=+ai.value;if(!n||!a)return;arr[idx].name=n;arr[idx].amount=a;if(type==='expense'&&di)arr[idx].dueDay=di.value?+di.value:null;renderAll();scheduleSave(currentKey());}
  sb.onclick=doSave;cb.onclick=()=>renderAll();
  [ni,ai].forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter')doSave();if(e.key==='Escape')renderAll();}));
}

// ── Item events ──
function handleItemClick(e){
  const btn=e.target.closest('[data-action]');if(!btn)return;
  const {action,type,i:iStr}=btn.dataset,i=+iStr,d=getMonthData(currentKey());
  if(action==='check'){if(type==='income')d.incomes[i].done=!d.incomes[i].done;else d.expenses[i].done=!d.expenses[i].done;renderAll();scheduleSave(currentKey());}
  else if(action==='delete'){if(type==='income')d.incomes.splice(i,1);else d.expenses.splice(i,1);renderAll();scheduleSave(currentKey());}
  else if(action==='edit')openEdit(type,i);
}
document.getElementById('incomeList').addEventListener('click',handleItemClick);
document.getElementById('expenseList').addEventListener('click',handleItemClick);

// ── Month nav ──
async function goMonth(dy){
  currentMonth+=dy;
  if(currentMonth<0){currentMonth=11;currentYear--;}
  if(currentMonth>11){currentMonth=0;currentYear++;}
  setSyncStatus('busy','กำลังโหลด...');
  await loadMonthFromSheets(currentKey());
  setSyncStatus('ok','โหลดแล้ว');
  renderAll();
}
document.getElementById('prevMonthBtn').onclick=()=>goMonth(-1);
document.getElementById('nextMonthBtn').onclick=()=>goMonth(1);

// ── Settings ──
document.getElementById('settingsToggle').onclick=()=>{const b=document.getElementById('settingsBody'),c=document.getElementById('settingsChevron');b.classList.toggle('open');c.textContent=b.classList.contains('open')?'▴':'▾';};
document.getElementById('saveProfileBtn').onclick=async()=>{
  profile.dailyWage=+document.getElementById('dailyWage').value||0;
  profile.taxRate=+document.getElementById('taxRate').value||0;
  await saveProfileToSheets();
  document.getElementById('profileStatus').textContent=`✓ บันทึกแล้ว — ค่าแรง ${fmt(profile.dailyWage)} / ภาษี ${profile.taxRate}%`;
  setTimeout(()=>updateProfileUI(),2000);
};

// ── Mode tabs ──
document.querySelectorAll('.mode-tab').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('.mode-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');incomeMode=btn.dataset.mode;document.getElementById('modeManual').style.display=incomeMode==='manual'?'flex':'none';document.getElementById('modeCalc').style.display=incomeMode==='calc'?'flex':'none';};});
document.getElementById('modeManual').style.display='flex';
document.getElementById('workDays').oninput=()=>{const days=+document.getElementById('workDays').value||0,box=document.getElementById('calcPreview');if(!days||!profile.dailyWage){box.classList.remove('show');return;}const gross=days*profile.dailyWage,tax=gross*(profile.taxRate/100),net=gross-tax;box.classList.add('show');box.textContent=`${days} วัน × ${fmt(profile.dailyWage)} − ภาษี ${profile.taxRate||0}% (${fmt(tax)}) = ${fmt(net)}`;};

// ── Add items ──
document.getElementById('addIncomeManualBtn').onclick=async()=>{const n=document.getElementById('incomeNameManual').value.trim(),a=+document.getElementById('incomeAmountManual').value;if(!n||!a)return;getMonthData(currentKey()).incomes.push({id:uid(),name:n,amount:a,done:false});document.getElementById('incomeNameManual').value='';document.getElementById('incomeAmountManual').value='';renderAll();scheduleSave(currentKey());};
document.getElementById('addIncomeCalcBtn').onclick=async()=>{const n=document.getElementById('incomeNameCalc').value.trim(),days=+document.getElementById('workDays').value||0;if(!n||!days||!profile.dailyWage){if(!profile.dailyWage){document.getElementById('settingsBody').classList.add('open');document.getElementById('settingsChevron').textContent='▴';}return;}const gross=days*profile.dailyWage,net=gross-gross*(profile.taxRate/100);getMonthData(currentKey()).incomes.push({id:uid(),name:n,amount:net,done:false});document.getElementById('incomeNameCalc').value='';document.getElementById('workDays').value='';document.getElementById('calcPreview').classList.remove('show');renderAll();scheduleSave(currentKey());};
document.getElementById('addExpenseBtn').onclick=async()=>{const n=document.getElementById('expenseName').value.trim(),a=+document.getElementById('expenseAmount').value,dd=document.getElementById('expenseDueDay').value;if(!n||!a)return;getMonthData(currentKey()).expenses.push({id:uid(),name:n,amount:a,dueDay:dd?+dd:null,done:false});document.getElementById('expenseName').value='';document.getElementById('expenseAmount').value='';document.getElementById('expenseDueDay').value='';renderAll();scheduleSave(currentKey());};
document.getElementById('copyFromPrevBtn').onclick=async()=>{const pk=prevKey(),pd=plans[pk];if(!pd)return;const cur=getMonthData(currentKey());cur.incomes=pd.incomes.map(x=>({...x,id:uid(),done:false}));cur.expenses=pd.expenses.map(x=>({...x,id:uid(),done:false}));renderAll();scheduleSave(currentKey());};

// ── Paste modal ──
function openPasteModal(type){const d=getMonthData(currentKey()),items=type==='income'?d.incomes:d.expenses,label=type==='income'?'รายได้':'รายจ่าย';if(!items.length){showToast(`ไม่มี${label}ในเดือนนี้`);return;}clipboard={type,items:JSON.parse(JSON.stringify(items)),label};let ty=currentYear,tm=currentMonth+1;if(tm>11){tm=0;ty++;}pasteTargetYear=ty;pasteTargetMonth=tm;document.getElementById('pasteModalTitle').textContent=`วาง${label}ไปยังเดือน`;document.getElementById('pasteModalDesc').textContent=`${items.length} รายการจาก ${MONTHS_TH[currentMonth]} ${currentYear+543}`;renderPasteGrid();document.getElementById('pasteModal').classList.add('open');}
function renderPasteGrid(){document.getElementById('pasteYearLabel').textContent=`${pasteTargetYear+543}`;const grid=document.getElementById('pasteMonthGrid');grid.innerHTML=MONTHS_TH.map((m,i)=>`<button class="month-opt ${i===pasteTargetMonth?'selected':''}" data-m="${i}">${m.slice(0,3)}</button>`).join('');grid.querySelectorAll('.month-opt').forEach(btn=>{btn.onclick=()=>{pasteTargetMonth=+btn.dataset.m;renderPasteGrid();};});}
function closePasteModal(){document.getElementById('pasteModal').classList.remove('open');clipboard=null;}
document.getElementById('pasteYearPrev').onclick=()=>{pasteTargetYear--;renderPasteGrid();};
document.getElementById('pasteYearNext').onclick=()=>{pasteTargetYear++;renderPasteGrid();};
document.getElementById('pasteModalCancel').onclick=closePasteModal;
document.getElementById('pasteModal').addEventListener('click',e=>{if(e.target===document.getElementById('pasteModal'))closePasteModal();});
document.getElementById('pasteModalConfirm').onclick=async()=>{if(!clipboard)return;const tk=monthKey(pasteTargetYear,pasteTargetMonth);await loadMonthFromSheets(tk);const target=getMonthData(tk);const newItems=clipboard.items.map(x=>({...x,id:uid(),done:false}));if(clipboard.type==='income')target.incomes=[...target.incomes,...newItems];else target.expenses=[...target.expenses,...newItems];await saveMonthToSheets(tk);closePasteModal();currentYear=pasteTargetYear;currentMonth=pasteTargetMonth;renderAll();showToast(`✓ วางรายการไปยัง ${MONTHS_TH[pasteTargetMonth]} ${pasteTargetYear+543} แล้ว`);};
document.getElementById('copyIncomeBtn').onclick=()=>openPasteModal('income');
document.getElementById('copyExpenseBtn').onclick=()=>openPasteModal('expense');

['incomeNameManual','incomeAmountManual'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addIncomeManualBtn').click();}));
['incomeNameCalc','workDays'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addIncomeCalcBtn').click();}));
['expenseName','expenseAmount','expenseDueDay'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addExpenseBtn').click();}));

// ── Init app (after PIN) ──
async function initApp(){
  setSyncStatus('busy','กำลังโหลด...');
  await Promise.all([loadMonthFromSheets(currentKey()),loadProfileFromSheets()]);
  setSyncStatus('ok','พร้อมใช้งาน');
  renderAll();
}

// ── Boot ──
buildNumpad();
if(sessionStorage.getItem(SESSION_KEY)==='1'){showMainApp();}
</script>
